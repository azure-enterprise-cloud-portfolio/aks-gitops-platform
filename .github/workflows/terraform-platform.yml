# =============================================================================
# Terraform Platform Workflow
# Runs plan on every PR and push to main.
# Applies only on push to main after manual approval via GitHub environment.
#
# Auth: OIDC federated credentials — no client secrets stored in GitHub.
# State: Stored in Azure Blob Storage, locked during apply.
# Concurrency: Shared group with workload workflows — prevents state lock conflicts.
# =============================================================================

name: Terraform Platform

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/envs/platform/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-platform.yml"

  push:
    branches:
      - main
    paths:
      - "terraform/envs/platform/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-platform.yml"

# OIDC auth requires id-token write; contents read for checkout
permissions:
  id-token: write
  contents: read

# Shared concurrency group with workload workflows — prevents simultaneous
# state lock conflicts across platform and dev/test/prod pipelines
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_WORKING_DIR: terraform/envs/platform
  TF_VERSION: "1.14.3" # Align with required_version in versions.tf

jobs:
  # ===========================================================================
  # Plan
  # Runs on every PR and push to main.
  # Validates, formats, and plans — never applies.
  # Uploads plan artifact on push to main for apply job to consume.
  # ===========================================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        # Federated credentials — no client secret needed
        # Secrets inherited from GitHub org or repo settings
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # Required for detailed-exitcode to work correctly

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # Passes OIDC credentials explicitly to the backend
        # Prevents CLI auth fallback during remote state access
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        # Exit codes: 0 = no changes, 1 = error, 2 = changes present
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -detailed-exitcode -out=tfplan
        env:
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Upload Plan Artifact
        # Only upload on push to main — apply job will consume this exact plan file
        # retention-days: 1 — plan is stale after 24hrs, force re-plan
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-platform
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  # ===========================================================================
  # Apply
  # Runs only on push to main after plan succeeds.
  # Pauses for manual approval via GitHub environment protection rules.
  # Applies exactly the plan file produced by the plan job — no drift.
  # ===========================================================================
  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Configure reviewers in GitHub Settings → Environments → platform-shared
    # Apply will not proceed until a reviewer approves
    environment: platform-shared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        # OIDC tokens are job-scoped — must re-authenticate in every job
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      - name: Download Plan Artifact
        # Downloads exactly the plan produced by the plan job
        # Guarantees apply matches what was reviewed and approved
        uses: actions/download-artifact@v4
        with:
          name: tfplan-platform
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}