name: Terraform Workloads

on:
  # Plan on PRs targeting main (no apply)
  pull_request:
    branches:
      - main
    paths:
      - "terraform/envs/dev/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-workloads.yml"

  # Plan + apply on push/merge to main
  push:
    branches:
      - main
    paths:
      - "terraform/envs/dev/**"
      - "terraform/modules/**"
      - ".github/workflows/terraform-workloads.yml"

# OIDC auth requires id-token write; contents read for checkout
permissions:
  id-token: write
  contents: read

# Only one Terraform workflow runs at a time — prevents state lock conflicts
concurrency:
  group: terraform-state
  cancel-in-progress: false  # queue rather than cancel  

jobs:
  # ── DEV ──────────────────────────────────────────────────────────────────
  # PR to main : plan only (no artifact upload, no apply)
  # Push to main: plan + upload artifact + apply

  plan-dev:
    name: Plan Dev
    # Run on push to main OR on any PR targeting main
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Authenticate to Azure using OIDC — no client secret needed
      # Requires a federated credential on the App Registration for refs/heads/main
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6

      # Fail fast if any .tf files are not formatted correctly
      - name: Terraform Format Check
        working-directory: terraform/envs/dev
        run: terraform fmt -check -recursive

      # Backend (state) lives in the platform subscription, not the dev subscription
      # so we pass the platform subscription ID for state access only
      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      # Validate configuration is syntactically correct and internally consistent
      - name: Terraform Validate
        working-directory: terraform/envs/dev
        run: terraform validate

      # -detailed-exitcode returns 2 when changes are detected (not an error)
      # exit 1 = real terraform error; exit 0/2 = success or changes pending — both are fine
      - name: Terraform Plan
        working-directory: terraform/envs/dev
        run: |
          terraform plan -detailed-exitcode -out=tfplan
          exit_code=$?
          if [ $exit_code -eq 1 ]; then exit 1; fi
          exit 0
        env:
          TF_VAR_dev_subscription_id:      ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      # Only upload the plan artifact on push to main — apply-dev will download and use it
      # Skipped on PRs since we don't apply from PRs
      - name: Upload Plan Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/envs/dev/tfplan
          retention-days: 1

  apply-dev:
    name: Apply Dev
    needs: plan-dev  # must pass plan before apply runs
    # Only apply on push to main — never on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: workload-dev  # no required reviewers — auto deploys to dev

    steps:
      - uses: actions/checkout@v4

      # Re-authenticate for the apply job — each job gets a fresh runner
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.6

      # Re-init required — each job runs on a fresh runner with no local state
      - name: Terraform Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}"

      # Download the exact plan that was reviewed in plan-dev — ensures apply matches plan
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/envs/dev

      # Apply the saved plan — -auto-approve is safe here because the plan was already reviewed
      - name: Terraform Apply
        working-directory: terraform/envs/dev
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_dev_subscription_id:      ${{ secrets.AZURE_DEV_SUBSCRIPTION_ID }}
          TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}

  # ── QA & PROD ─────────────────────────────────────────────────────────────
  # Uncomment when terraform/envs/qa and terraform/envs/prod are ready
  # Also add org secrets: AZURE_QA_SUBSCRIPTION_ID, AZURE_PROD_SUBSCRIPTION_ID
  # Also create GitHub environments: workload-qa, workload-prod (with required reviewers)

  # plan-qa:
  #   ...

  # apply-qa:
  #   ...

  # plan-prod:
  #   ...

  # apply-prod:
  #   ...